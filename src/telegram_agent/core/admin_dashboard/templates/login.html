{% extends "base.html" %}
{% block title %}Login · Admin Dashboard{% endblock %}
{% block main_class %}login-layout{% endblock %}
{% block content %}
<section class="login-card">
  <h1>Admin login</h1>
  <p class="muted small">Read-only operational dashboard. No production writes.</p>
  {% if error %}
    <div class="banner banner-error">Invalid username or password.</div>
  {% endif %}
  <form method="post" action="/login" class="stack">
    <label>
      Username
      <input type="text" name="username" autocomplete="username" required autofocus>
    </label>
    <label>
      Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="btn btn-primary btn-block">Sign in</button>
  </form>
</section>
{% endblock %}
