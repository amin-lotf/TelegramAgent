services:
  telegram-auth:
    build:
      context: ../..
      dockerfile: docker/app/Dockerfile.app
      target: telegram-auth
    container_name: telegram_auth_app
    env_file:
      - .env.telegram_auth.docker
    command: uvicorn telegram_agent.core.telegram_auth.api.v1.fastapi_app:fastapi_app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../..:/app
    networks:
      - fatol-net
networks:
  fatol-net:
