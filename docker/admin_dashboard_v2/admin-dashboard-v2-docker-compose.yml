name: telegram-agent-admin-dashboard-v2

services:
  admin-dashboard-v2:
    build:
      context: ../..
      dockerfile: docker/admin_dashboard_v2/Dockerfile
    container_name: telegram_agent_admin_dashboard_v2
    env_file:
      - path: .env.admin_dashboard_v2.docker
        format: raw
    ports:
      - "127.0.0.1:8080:8000"
    networks:
      - fatol-net
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2).read()"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  fatol-net:
