services:
  madlad:
    profiles: ["madlad"]
    build:
      context: ../..
      dockerfile: docker/madlad/Dockerfile
    image: telegram-agent-madlad:local
    container_name: madlad
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    env_file:
      - path: .env.madlad.docker
        required: false
    environment:
      MADLAD_ADAPTER_DIR: /adapters
      MADLAD_HF_HOME: /home/appuser/.cache/huggingface
      HF_HOME: /home/appuser/.cache/huggingface
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ports:
      - "127.0.0.1:8003:8000"
    volumes:
      - ../../pretrained_models/madlad:/adapters:ro
      - ../../pretrained_models/madlad-hf-cache:/home/appuser/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: "2gb"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 600s
    networks:
      - fatol-net

networks:
  fatol-net:
