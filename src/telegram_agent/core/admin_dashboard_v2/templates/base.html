<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}TelegramAgent operations{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/dashboard.css') }}">
    <script defer src="{{ url_for('static', path='/js/dashboard.js') }}"></script>
</head>
<body>
<header class="topbar">
    <div>
        <a class="brand" href="/messages">TelegramAgent <span>operations v2</span></a>
        <p class="tagline">Read-only cross-service message traces</p>
    </div>
    <div class="admin-chip" title="Authenticated administrator">{{ admin_username }}</div>
</header>
{% block body %}{% endblock %}
</body>
</html>
