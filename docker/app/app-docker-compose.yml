services:
  telegram-auth:
    build:
      context: ../..
      dockerfile: docker/app/Dockerfile
      target: telegram-auth
    container_name: telegram_auth_app
    env_file:
      - .env.telegram_auth.docker
    command: python -m uvicorn telegram_agent.core.telegram_auth.api.v1.fastapi_app:fastapi_app --host 0.0.0.0 --port 8000
    volumes:
      - ../..:/app
    networks:
      - fatol-net
  telegram-ingress:
    build:
      context: ../..
      dockerfile: docker/app/Dockerfile
      target: telegram-ingress
    container_name: telegram_ingress_app
    env_file:
      - .env.telegram_ingress.docker
    command: python -m uvicorn telegram_agent.core.telegram_ingress.api.v1.fastapi_app:fastapi_app --host 0.0.0.0 --port 8000
    volumes:
      - ../..:/app
    networks:
      - fatol-net
  content-processing:
    build:
      context: ../..
      dockerfile: docker/app/Dockerfile
      target: content-processing
    container_name: content_processing_app
    env_file:
      - .env.content_processing.docker
    command: python -m uvicorn telegram_agent.core.content_processing.api.v1.fastapi_app:fastapi_app --host 0.0.0.0 --port 8000
    volumes:
      - ../..:/app
      # Shared with local Bot API for absolute file_path access from getFile (--local).
      - telegram_bot_api_data:/var/lib/telegram-bot-api:ro
    networks:
      - fatol-net
  agent-runtime:
    build:
      context: ../..
      dockerfile: docker/app/Dockerfile
      target: agent-runtime
    container_name: agent_runtime_app
    env_file:
      - .env.agent_runtime.docker
    command: python -m uvicorn telegram_agent.core.agent_runtime.api.v1.fastapi_app:fastapi_app --host 0.0.0.0 --port 8000
    volumes:
      - ../..:/app
    networks:
      - fatol-net
  llm_gateway:
    build:
      context: ../..
      dockerfile: docker/app/Dockerfile
      target: llm-gateway
    container_name: llm_gateway_app
    env_file:
      - .env.llm_gateway.docker
    command: >
      python -m uvicorn
      telegram_agent.core.llm_gateway.api.v1.fastapi_app:fastapi_app
      --host 0.0.0.0 --port 8000
    volumes:
      - ../..:/app
    networks:
      - fatol-net
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).read()",
        ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
volumes:
  telegram_bot_api_data:

networks:
  fatol-net:
