services:
  gpu-execution:
    build:
      context: ../..
      dockerfile: docker/app/Dockerfile
      target: gpu-execution
    container_name: gpu_execution_app
    env_file:
      - path: .env.gpu_execution.docker
        required: false
    environment:
      GPU_EXECUTION_SERVICE_TOKEN: ${GPU_EXECUTION_SERVICE_TOKEN:-replace-me}
      SQLALCHEMY_DATABASE_URL: postgresql://telegram:Telegram2026@gpu_execution_postgres:5432/telegram_agent
      REDIS_URL: redis://redis:6379/0
      GPU_SHARED_STORAGE_ROOT: /app/media
    command: >
      python -m uvicorn telegram_agent.core.gpu_execution.api.v1.fastapi_app:fastapi_app
      --host 0.0.0.0 --port 8000
    volumes:
      - ../..:/app
    depends_on:
      gpu-execution-migrate:
        condition: service_completed_successfully
    networks:
      - fatol-net

  gpu-execution-worker:
    build:
      context: ../..
      dockerfile: docker/app/Dockerfile
      target: gpu-execution-worker
    container_name: gpu_execution_worker
    env_file:
      - path: .env.gpu_execution.docker
        required: false
    environment:
      GPU_EXECUTION_SERVICE_TOKEN: ${GPU_EXECUTION_SERVICE_TOKEN:-replace-me}
      SQLALCHEMY_DATABASE_URL: postgresql://telegram:Telegram2026@gpu_execution_postgres:5432/telegram_agent
      REDIS_URL: redis://redis:6379/0
      GPU_SHARED_STORAGE_ROOT: /app/media
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      COSYVOICE_MODEL_ID: ${COSYVOICE_MODEL_ID:-FunAudioLLM/Fun-CosyVoice3-0.5B-2512}
      COSYVOICE_MODEL_DIR: /opt/CosyVoice/pretrained_models/Fun-CosyVoice3-0.5B
      SAM_AUDIO_MODEL: ${SAM_AUDIO_MODEL:-facebook/sam-audio-small}
      SAM_AUDIO_CHECKPOINTS_DIR: /app/.checkpoints
      MADLAD_MODEL_ID: ${MADLAD_MODEL_ID:-google/madlad400-3b-mt}
      MADLAD_ADAPTER_DIR: /adapters
      MADLAD_LOAD_LORA_FOR: ${MADLAD_LOAD_LORA_FOR:-fa}
      MADLAD_HF_HOME: /opt/madlad-hf-cache
      MADLAD_DEVICE: auto
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ../../.cache/huggingface:/root/.cache/huggingface
      - ../../.cache/modelscope:/root/.cache/modelscope
      - ../../.cache/cosyvoice:/opt/CosyVoice/pretrained_models
      - ../../pretrained_models/madlad:/adapters:ro
      - ../../pretrained_models/madlad-hf-cache:/opt/madlad-hf-cache
      - ../..:/app
      # ImageBind writes CWD/.checkpoints (WORKDIR=/app), not HF_HOME.
      # Persist it or every container recreate re-downloads ~4.5 GiB.
      - ../../pretrained_models/sam-audio-checkpoints:/app/.checkpoints
    ipc: host
    depends_on:
      gpu-execution-migrate:
        condition: service_completed_successfully
    command: >
      python -m celery -A telegram_agent.core.gpu_execution.celery.celery_app.celery_app worker
      -Q gpu_execution --pool=solo --concurrency=1 --prefetch-multiplier=1
      --loglevel=info
    stop_grace_period: 45s
    networks:
      - fatol-net

  gpu-dubbing-models-init:
    profiles: ["dubbing-init"]
    build:
      context: ../..
      dockerfile: docker/app/Dockerfile
      target: gpu-execution-worker
    container_name: gpu_dubbing_models_init
    env_file:
      - path: .env.gpu_execution.docker
        required: false
    environment:
      HF_HOME: /root/.cache/huggingface
      COSYVOICE_MODEL_ID: ${COSYVOICE_MODEL_ID:-FunAudioLLM/Fun-CosyVoice3-0.5B-2512}
      COSYVOICE_MODEL_DIR: /opt/CosyVoice/pretrained_models/Fun-CosyVoice3-0.5B
      SAM_AUDIO_MODEL: ${SAM_AUDIO_MODEL:-facebook/sam-audio-small}
      SAM_AUDIO_CHECKPOINTS_DIR: /app/.checkpoints
      MADLAD_MODEL_ID: ${MADLAD_MODEL_ID:-google/madlad400-3b-mt}
      MADLAD_HF_HOME: /opt/madlad-hf-cache
      WHISPERX_MODEL: ${WHISPERX_MODEL:-large-v3}
    command: python /app/scripts/download_models.py --execute
    volumes:
      - ../../.cache/huggingface:/root/.cache/huggingface
      - ../../.cache/cosyvoice:/opt/CosyVoice/pretrained_models
      - ../..:/app:ro
      - ../../pretrained_models/sam-audio-checkpoints:/app/.checkpoints
      - ../../pretrained_models/madlad-hf-cache:/opt/madlad-hf-cache
    networks:
      - fatol-net

  gpu-execution-control-worker:
    build:
      context: ../..
      dockerfile: docker/app/Dockerfile
      target: gpu-execution
    container_name: gpu_execution_control_worker
    env_file:
      - path: .env.gpu_execution.docker
        required: false
    environment:
      GPU_EXECUTION_SERVICE_TOKEN: ${GPU_EXECUTION_SERVICE_TOKEN:-replace-me}
      SQLALCHEMY_DATABASE_URL: postgresql://telegram:Telegram2026@gpu_execution_postgres:5432/telegram_agent
      REDIS_URL: redis://redis:6379/0
      GPU_SHARED_STORAGE_ROOT: /app/media
    command: >
      python -m celery -A telegram_agent.core.gpu_execution.celery.celery_app.celery_app worker
      -Q gpu_execution_control --concurrency=1 --prefetch-multiplier=1
      --loglevel=info
    volumes:
      - ../..:/app
    depends_on:
      gpu-execution-migrate:
        condition: service_completed_successfully
    networks:
      - fatol-net

  gpu-execution-beat:
    build:
      context: ../..
      dockerfile: docker/app/Dockerfile
      target: gpu-execution
    container_name: gpu_execution_beat
    env_file:
      - path: .env.gpu_execution.docker
        required: false
    environment:
      GPU_EXECUTION_SERVICE_TOKEN: ${GPU_EXECUTION_SERVICE_TOKEN:-replace-me}
      SQLALCHEMY_DATABASE_URL: postgresql://telegram:Telegram2026@gpu_execution_postgres:5432/telegram_agent
      REDIS_URL: redis://redis:6379/0
      GPU_SHARED_STORAGE_ROOT: /app/media
    command: >
      python -m celery -A telegram_agent.core.gpu_execution.celery.celery_app.celery_app beat
      --loglevel=info
    volumes:
      - ../..:/app
    depends_on:
      gpu-execution-migrate:
        condition: service_completed_successfully
    networks:
      - fatol-net

networks:
  fatol-net:
