services:
  content-processing-worker:
    build:
      context: ../..
      dockerfile: docker/app/Dockerfile
      target: content-processing-worker
    container_name: content_processing_worker
    env_file:
      - .env.content_processing.docker
    # For a dedicated transcript worker, run:
    # celery -A web_analyzer.core.content_processor.celery_app.celery_app worker
    # -Q video_transcript --concurrency=1 --prefetch-multiplier=1 --loglevel=info
    command: >
      python -m celery -A telegram_agent.core.content_processing.celery.celery_app.celery_app worker
      -Q telegram_download,media_transcription,media_emotion_extraction,outbox_dispatch,telegram_ingress_callback,download_preparation,download_delivery
      --loglevel=info

    volumes:
      - ../..:/app
      # Local Bot API (--local) stores downloaded media as absolute paths under this dir.
      - telegram_bot_api_data:/var/lib/telegram-bot-api:ro
    networks:
      - fatol-net

  content-processing-beat:
    build:
      context: ../..
      dockerfile: docker/app/Dockerfile
      target: content-processing-worker
    container_name: content_processing_beat
    env_file:
      - .env.content_processing.docker
    command: >
      python -m celery -A telegram_agent.core.content_processing.celery.celery_app.celery_app beat
      --loglevel=info
    volumes:
      - ../..:/app
    networks:
      - fatol-net

  telegram-ingress-worker:
    build:
      context: ../..
      dockerfile: docker/app/Dockerfile
      target: telegram-ingress
    container_name: telegram_ingress_worker
    env_file:
      - .env.telegram_ingress.docker
    command: >
      python -m celery -A telegram_agent.core.telegram_ingress.celery.celery_app.celery_app worker
      -Q telegram_ingress_outbox
      --loglevel=info
    volumes:
      - ../..:/app
    networks:
      - fatol-net

  telegram-ingress-beat:
    build:
      context: ../..
      dockerfile: docker/app/Dockerfile
      target: telegram-ingress
    container_name: telegram_ingress_beat
    env_file:
      - .env.telegram_ingress.docker
    command: >
      python -m celery -A telegram_agent.core.telegram_ingress.celery.celery_app.celery_app beat
      --loglevel=info
    volumes:
      - ../..:/app
    networks:
      - fatol-net

  agent-runtime-worker:
    build:
      context: ../..
      dockerfile: docker/app/Dockerfile
      target: agent-runtime
    container_name: agent_runtime_worker
    env_file:
      - .env.agent_runtime.docker
    command: >
      python -m celery -A telegram_agent.core.agent_runtime.celery.celery_app.celery_app worker
      -Q agent_runtime_outbox,agent_runtime_coordination,agent_runtime_classification,agent_runtime_download,agent_runtime_content_handoff
      --loglevel=info
    volumes:
      - ../..:/app
    depends_on:
      llm_gateway:
        condition: service_healthy
    networks:
      - fatol-net

  agent-runtime-beat:
    build:
      context: ../..
      dockerfile: docker/app/Dockerfile
      target: agent-runtime
    container_name: agent_runtime_beat
    env_file:
      - .env.agent_runtime.docker
    command: >
      python -m celery -A telegram_agent.core.agent_runtime.celery.celery_app.celery_app beat
      --loglevel=info
    volumes:
      - ../..:/app
    networks:
      - fatol-net

volumes:
  telegram_bot_api_data:

networks:
  fatol-net:
