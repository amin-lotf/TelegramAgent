services:
  sensevoice:
    build:
      context: ../..
      dockerfile: docker/app/Dockerfile
      target: sensevoice
    env_file:
      - .env.sensevoice.docker
    container_name: sensevoice_service
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

    deploy:
        resources:
          reservations:
            devices:
              - driver: nvidia
                count: all
                capabilities:
                  - gpu
    volumes:
      - ../../.cache/modelscope:/root/.cache/modelscope
      - ../../.cache/huggingface:/root/.cache/huggingface
      - ../..:/app
    ipc: host
    command: >
      python -m uvicorn telegram_agent.core.sensevoice.api.v1.fastapi_app:fastapi_app
      --host 0.0.0.0
      --port 8000
    networks:
      - fatol-net

networks:
  fatol-net:
